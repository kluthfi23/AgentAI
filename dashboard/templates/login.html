<!DOCTYPE html>
<html>

<head>

<title>AgentAI Login</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px;
    width:100%;
}

</style>

</head>

<body>

<div class="card">

<h1>🤖 AgentAI Login</h1>

<form method="post">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
